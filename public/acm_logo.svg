<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="acmBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#0055BB" />
    </linearGradient>
    <filter id="acmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glowing Blue Diamond -->
  <polygon points="50,4 96,50 50,96 4,50" fill="url(#acmBlueGrad)" stroke="#38BDF8" stroke-width="2" />

  <!-- Inner Diamond Border -->
  <polygon points="50,11 89,50 50,89 11,50" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.9" />

  <!-- Central "acm" Wordmark -->
  <text x="50" y="58" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">acm</text>
</svg>
